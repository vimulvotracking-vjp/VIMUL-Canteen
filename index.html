<!DOCTYPE html>
<html>
<head>

<title>VIMUL Smart Canteen</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:20px;
margin:0;
}

h2{
margin-bottom:20px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:15px;
max-width:420px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input{
width:90%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1e7e34;
}

.menu-item{
margin-top:15px;
text-align:left;
}

.menu-item label{
font-weight:bold;
display:block;
margin-bottom:5px;
}

.qty{
width:100%;
}

.token{
font-size:26px;
color:red;
margin-top:20px;
font-weight:bold;
}

.success{
color:green;
margin-top:10px;
font-size:18px;
}

.footer{
margin-top:40px;
font-size:14px;
opacity:0.7;
}

</style>

</head>

<body>

<h2>VIMUL<br>Smart Canteen</h2>

<!-- LOGIN BOX -->

<div class="box" id="loginBox">

<h3>Employee Login</h3>

<input type="text" id="empid" placeholder="Employee ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>


<!-- ORDER BOX -->

<div class="box" id="orderBox" style="display:none">

<h3>Order Menu</h3>

<div class="menu-item">
<label>Employee Meal ₹30</label>
<input type="number" id="meal" class="qty" value="0" min="0">
</div>

<div class="menu-item">
<label>Tea ₹5</label>
<input type="number" id="tea" class="qty" value="0" min="0">
</div>

<div class="menu-item">
<label>Other Meal ₹35</label>
<input type="number" id="other" class="qty" value="0" min="0">
</div>

<button onclick="placeOrder()">Place Order</button>

<div class="success" id="message"></div>
<div class="token" id="token"></div>

</div>

<div class="footer">
Ordering allowed only before 10:30 AM
</div>


<script>

var empid="";
var name="";

var scriptURL="https://script.google.com/macros/s/AKfycbwN5CLy0DzeIa_-ajKFkDjwFf5VIc0ajtLmAIGy--4mq44_NJTiCEX8X5vedDz8DW1exA/exec"; 


function login(){

empid=document.getElementById("empid").value.trim();
var password=document.getElementById("password").value.trim();

if(empid=="" || password==""){
alert("Enter Employee ID and Password");
return;
}

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
action:"login",
empid:empid,
password:password
})
})

.then(res=>res.json())

.then(data=>{

if(data.status=="success"){

name=data.name;

document.getElementById("loginBox").style.display="none";
document.getElementById("orderBox").style.display="block";

}
else{
alert("Invalid Employee ID or Password");
}

});

}



function placeOrder(){

var meal=document.getElementById("meal").value;
var tea=document.getElementById("tea").value;
var other=document.getElementById("other").value;

if(meal==0 && tea==0 && other==0){
alert("Please select at least one item");
return;
}

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
action:"order",
empid:empid,
name:name,
meal:meal,
tea:tea,
other:other
})
})

.then(res=>res.json())

.then(data=>{

if(data.status=="closed"){
alert("Ordering closed after 10:30 AM");
return;
}

if(data.status=="already"){
alert("You already placed order today");
return;
}

if(data.status=="success"){

document.getElementById("message").innerHTML="Order Placed Successfully";
document.getElementById("token").innerHTML="Token No : "+data.token;

document.getElementById("meal").value=0;
document.getElementById("tea").value=0;
document.getElementById("other").value=0;

}

});

}

</script>

</body>
</html>
