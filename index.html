<!DOCTYPE html>
<html>

<head>

<title>VIMUL Smart Canteen</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:20px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:15px;
max-width:400px;
margin:auto;
}

input{
width:90%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
font-size:18px;
}

.token{
font-size:28px;
color:red;
margin-top:15px;
}

</style>

</head>

<body>

<h2>VIMUL Smart Canteen</h2>


<div class="box" id="loginBox">

<h3>Employee Login</h3>

<input type="text" id="empid" placeholder="Employee ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>



<div class="box" id="orderBox" style="display:none">

<h3>Order Menu</h3>

Employee Meal ₹30  
<input type="number" id="meal" value="0">

Tea ₹5  
<input type="number" id="tea" value="0">

Other Meal ₹35  
<input type="number" id="other" value="0">

<button onclick="placeOrder()">Place Order</button>

<div class="token" id="token"></div>

</div>



<script>

var empid="";
var name="";

var scriptURL="https://script.google.com/macros/s/AKfycbx1V-A2EdE0xlmPxJ0AaNOW7ZOHq96pIrT_F81GSAieOjCZFKNyQp-U4t9lGKYaoUCNmQ/exec";


function login(){

empid=document.getElementById("empid").value;

var password=document.getElementById("password").value;

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
action:"login",
empid:empid,
password:password
})
})

.then(res=>res.json())

.then(data=>{

if(data.status=="success"){

name=data.name;

document.getElementById("loginBox").style.display="none";
document.getElementById("orderBox").style.display="block";

}

else{

alert("Invalid Employee ID or Password");

}

});

}



function placeOrder(){

var meal=document.getElementById("meal").value;
var tea=document.getElementById("tea").value;
var other=document.getElementById("other").value;

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
action:"order",
empid:empid,
name:name,
meal:meal,
tea:tea,
other:other
})
})

.then(res=>res.json())

.then(data=>{

document.getElementById("token").innerHTML=
"Order Placed<br>Token No : "+data.token;

});

}

</script>

</body>

</html>
